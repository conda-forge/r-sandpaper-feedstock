schema_version: 1

context:
  version: "0.21.1"

package:
  name: r-sandpaper
  version: ${{ version }}

source:
  url: https://github.com/carpentries/sandpaper/archive/refs/tags/${{ version }}.tar.gz
  sha256: af5fdb0fa67924a79f591d5896b26c0d4b583ce6a656530fc99c272c5324524a

build:
  number: 0
  noarch: generic
  script: ${{ R }} CMD INSTALL --build .

requirements:
  host:
    - r-base
    - r-assertthat
    - r-callr
    - r-cffr
    - r-cli >=3.4.0
    - r-commonmark
    - r-desc
    - r-fs >=1.5.0
    - r-gert >=1.0.1
    - r-gh
    - r-glue
    - r-httr
    - r-knitr >=1.33
    - r-markdown
    - r-pegboard >=0.7.0
    - r-pkgdown >=1.6.0
    - r-renv >=0.14.0
    - r-rlang >=0.4.3
    - r-rmarkdown >=2.4
    - r-rprojroot
    - r-rstudioapi
    - r-servr
    - r-stringr
    - r-usethis >=2.0.0
    - r-whisker
    - r-withr
    - r-yaml
    - r-r.utils
    - r-xfun
    - r-nanonext >=1.8.0
  run:
    - r-base
    - r-assertthat
    - r-callr
    - r-cffr
    - r-cli >=3.4.0
    - r-commonmark
    - r-desc
    - r-fs >=1.5.0
    - r-gert >=1.0.1
    - r-gh
    - r-glue
    - r-httr
    - r-knitr >=1.33
    - r-markdown
    - r-pegboard >=0.7.0
    - r-pkgdown >=1.6.0
    - r-renv >=0.14.0
    - r-rlang >=0.4.3
    - r-rmarkdown >=2.4
    - r-rprojroot
    - r-rstudioapi
    - r-servr
    - r-stringr
    - r-usethis >=2.0.0
    - r-whisker
    - r-withr
    - r-yaml
    - r-r.utils
    - r-xfun
    - r-nanonext >=1.8.0

tests:
  - r:
      libraries:
        - sandpaper
  - files:
      source:
        - tests/
    requirements:
      run:
        - git
        - r-testthat
        - r-mockr
        - r-sessioninfo
        - r-varnish
    script:
      # rattler-build normalizes LANG/LC_ALL to C.UTF-8, which makes gettext
      # ignore language switching and fails sandpaper's translation tests,
      # so restore a real locale (shipped with the CI docker images)
      - export LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
      # use R -e (not Rscript): Rscript implies --no-echo, which makes
      # renv >=1.2 load projects quietly and fails a sandpaper test that
      # expects renv startup output
      - R -e "testthat::test_file('tests/testthat.R', stop_on_failure=TRUE)"

about:
  license: MIT
  summary: Create and Curate Carpentries Lessons
  description: |
    The {sandpaper} package was created by
    [The Carpentries](https://carpentries.org) to re-imagine our method of
    creating lesson websites for our workshops.
    This package will take a series of
    [Markdown](https://www.markdownguide.org/getting-started/) or
    [RMarkdown](https://rmarkdown.rstudio.com/) files and generate a static
    website with the features and styling of The Carpentries lessons
    including customized layouts and callout blocks.
    Much of the functionality in this package is inspired by
    [Jenny Bryan's](https://jennybryan.org/) work with the
    [{usethis}](https://usethis.r-lib.org/) package.
  license_file:
    - ${{ PREFIX }}/lib/R/share/licenses/MIT
    - LICENSE
  homepage: https://carpentries.github.io/sandpaper/
  repository: https://github.com/carpentries/sandpaper/
  documentation: https://carpentries.github.io/sandpaper/

extra:
  recipe-maintainers:
    - conda-forge/r
    - matthewfeickert
